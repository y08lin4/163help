<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>网易云互助 · 客户端管理</title>
  <style>
    :root {
      --bg: #0f1420;
      --panel: #1a2232;
      --panel2: #222c42;
      --line: #2e3a54;
      --text: #e6eaf2;
      --muted: #8b96ad;
      --accent: #4c8dff;
      --accent2: #2f6be0;
      --green: #2ecc71;
      --amber: #f5a623;
      --red: #ff5f56;
      --radius: 10px;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      font-size: 14px;
      line-height: 1.6;
    }
    .wrap { max-width: 980px; margin: 0 auto; padding: 24px 20px 60px; }
    h1 { font-size: 20px; margin: 0 0 4px; }
    .sub { color: var(--muted); font-size: 13px; margin-bottom: 22px; }
    .topbar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; }
    .panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 18px;
      margin-bottom: 18px;
    }
    .panel h2 {
      font-size: 15px;
      margin: 0 0 14px;
      padding-bottom: 10px;
      border-bottom: 1px solid var(--line);
    }
    .grid { display: grid; gap: 14px; }
    .kv { display: grid; grid-template-columns: 130px 1fr; gap: 8px; align-items: center; }
    .kv .label { color: var(--muted); }
    .kv .val { word-break: break-all; }
    .badge {
      display: inline-block; padding: 2px 10px; border-radius: 999px;
      font-size: 12px; font-weight: 600;
    }
    .badge.run { background: rgba(46,204,113,.15); color: var(--green); border: 1px solid rgba(46,204,113,.4); }
    .badge.stop { background: rgba(255,95,86,.12); color: var(--red); border: 1px solid rgba(255,95,86,.4); }
    .badge.idle { background: rgba(138,150,173,.15); color: var(--muted); border: 1px solid rgba(138,150,173,.4); }
    .badge.blank { background: transparent; color: var(--muted); border: 1px dashed var(--line); }
    label { display: block; margin-bottom: 6px; color: var(--muted); font-size: 13px; }
    textarea, input[type="password"], input[type="text"], input[type="time"], select {
      width: 100%; padding: 8px 10px;
      background: var(--panel2); color: var(--text);
      border: 1px solid var(--line); border-radius: 6px;
      font-size: 13px; font-family: inherit;
    }
    textarea:focus, input:focus, select:focus { outline: none; border-color: var(--accent); }
    textarea { min-height: 84px; resize: vertical; font-family: ui-monospace, Consolas, monospace; }
    button {
      padding: 9px 18px; border: none; border-radius: 6px;
      background: var(--accent); color: #fff; font-size: 14px; cursor: pointer;
      transition: background .15s;
    }
    button:hover { background: var(--accent2); }
    button:disabled { background: #3a4a68; cursor: not-allowed; }
    button.danger { background: var(--red); }
    button.ghost { background: transparent; border: 1px solid var(--line); color: var(--muted); }
    button.btn-stop { background: var(--red); }
    .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
    .hint { color: var(--muted); font-size: 12px; margin-top: 6px; }
    .hint.err { color: var(--red); }
    .hint.ok { color: var(--green); }
    .msg { font-size: 13px; min-height: 18px; margin-top: 4px; }
    .msg.err { color: var(--red); } .msg.ok { color: var(--green); }
    /* 登录页 */
    .login-box { max-width: 360px; margin: 12vh auto 0; }
    .login-box h1 { text-align: center; }
    .login-box input { margin-bottom: 12px; }
    .login-box button { width: 100%; }
    /* 凭证单选 */
    .radio-group { display: flex; gap: 18px; margin-bottom: 10px; flex-wrap: wrap; }
    .radio-group label { display: flex; align-items: center; gap: 6px; margin: 0; color: var(--text); cursor: pointer; }
    /* 日志面板 */
    .log-panel {
      background: #0a0e16; border: 1px solid var(--line); border-radius: 6px;
      padding: 10px 12px; font-family: ui-monospace, Consolas, monospace;
      font-size: 12px; height: 240px; overflow-y: auto; white-space: pre-wrap;
      word-break: break-all; color: #c6d0e0;
    }
    .log-line { line-height: 1.5; }
    .controls { display: flex; gap: 10px; align-items: center; margin-bottom: 12px; }
    .hidden { display: none !important; }
    .task-name { font-weight: 600; }
    .seg { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 14px; }
  </style>
</head>
<body>
  <!-- 登录页 -->
  <div id="login-view" class="wrap">
    <div class="panel login-box">
      <h1>网易云互助 · 客户端</h1>
      <div class="sub" style="text-align:center;">请输入管理密码登录</div>
      <input type="password" id="login-password" placeholder="管理密码" autocomplete="current-password">
      <button id="login-btn">登录</button>
      <div id="login-msg" class="msg err"></div>
    </div>
  </div>

  <!-- 主界面 -->
  <div id="main-view" class="wrap hidden">
    <div class="topbar">
      <div>
        <h1>网易云互助 · 客户端管理</h1>
        <div class="sub">Docker 常驻客户端</div>
      </div>
      <button id="logout-btn" class="ghost">退出登录</button>
    </div>

    <!-- 状态区 -->
    <div class="panel">
      <h2>运行状态</h2>
      <div class="seg">
        <div class="kv"><span class="label">浏览器</span><span id="st-browser" class="val"></span></div>
        <div class="kv"><span class="label">调度器</span><span id="st-orchestrator" class="val"></span></div>
        <div class="kv"><span class="label">绑定账号</span><span id="st-account" class="val"></span></div>
        <div class="kv"><span class="label">当前任务</span><span id="st-task" class="val"></span></div>
        <div class="kv"><span class="label">今日帮了</span><span id="st-helped" class="val"></span></div>
        <div class="kv"><span class="label">今日被助</span><span id="st-received" class="val"></span></div>
        <div class="kv"><span class="label">积分</span><span id="st-points" class="val"></span></div>
        <div class="kv"><span class="label">凭证模式</span><span id="st-cred-mode" class="val"></span></div>
      </div>
    </div>

    <!-- 配置区 -->
    <div class="panel">
      <h2>配置</h2>

      <label>网易云 Cookie（MUSIC_U=...; __csrf=... 形式）</label>
      <textarea id="cfg-cookies" placeholder="MUSIC_U=...; __csrf=..."></textarea>
      <div class="hint">保存后会自动标记「需要重载页面」，调度器将重新加载网易云页面以生效。</div>
      <div class="hint" id="cfg-cookies-hint"></div>

      <div class="radio-group" style="margin-top:14px;">
        <label><input type="radio" name="cred-type" value="key">填写密钥（mh_ck_ 开头）</label>
        <label><input type="radio" name="cred-type" value="ticket">填写 ticket（自动领取）</label>
      </div>
      <input type="text" id="cfg-credential" placeholder="粘贴凭证">
      <div class="hint" id="cfg-credential-hint"></div>

      <label style="margin-top:14px;">偏好</label>
      <select id="cfg-preference">
        <option value="short">短歌</option>
        <option value="long">长歌</option>
        <option value="random">随机</option>
      </select>

      <label style="margin-top:14px;">活跃窗口（留空 = 全天不限制）</label>
      <div class="row">
        <input type="time" id="cfg-window-start" style="max-width:150px;">
        <span class="hint">至</span>
        <input type="time" id="cfg-window-end" style="max-width:150px;">
      </div>
      <div class="hint" id="cfg-window-hint"></div>

      <div class="row" style="margin-top:16px;">
        <button id="cfg-save-btn">保存配置</button>
      </div>
      <div id="cfg-msg" class="msg"></div>
    </div>

    <!-- 控制区 -->
    <div class="panel">
      <h2>控制</h2>
      <div class="controls">
        <button id="ctl-start-btn">启动</button>
        <button id="ctl-stop-btn" class="btn-stop">停止</button>
        <div id="ctl-msg" class="msg" style="flex:1;"></div>
      </div>
      <label>日志</label>
      <div id="log-panel" class="log-panel"></div>
    </div>
  </div>

  <script src="/app.js"></script>
</body>
</html>
